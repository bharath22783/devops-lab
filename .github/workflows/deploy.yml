name: DevOps Lab CD

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: read

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image
        run: |
          docker pull ghcr.io/bharath22783/devops-lab:test

      - name: Stop old application
        run: |
          docker rm -f ghcr-app-prod || true

      - name: Start new application
        run: |
          docker run -d \
            --name ghcr-app-prod \
            --restart unless-stopped \
            --network devops-lab_default \
            -p 5002:5000 \
            -e DB_HOST=postgres \
            -e POSTGRES_DB=labdb \
            -e POSTGRES_USER=labuser \
            -e POSTGRES_PASSWORD=labpassword \
            ghcr.io/bharath22783/devops-lab:test

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if docker exec ghcr-app-prod \
              wget -qO- http://127.0.0.1:5000/health; then
              exit 0
            fi
            sleep 2
          done

          echo "Application failed health check"
          docker logs ghcr-app-prod
          exit 1

      - name: Verify deployment
        run: |
          echo "Deployment successful"
          docker inspect ghcr-app-prod \
            --format 'Status={{.State.Status}}'

          docker exec ghcr-app-prod \
            wget -qO- http://127.0.0.1:5000/health
