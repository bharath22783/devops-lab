name: DevOps Lab CD

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: read

    steps:
      - name: Runner and Docker diagnostics
        run: |
          echo "=== USER ==="
          whoami
          id

          echo "=== HOST ==="
          hostname
          uname -m

          echo "=== DOCKER ==="
          which docker
          docker version --format 'Server={{.Server.Version}}'
          docker context show
          docker context ls

          echo "=== DOCKER ENVIRONMENT ==="
          echo "DOCKER_HOST=${DOCKER_HOST:-not-set}"

          echo "=== EXISTING CONTAINERS ==="
          docker ps -a

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image
        run: |
          docker pull ghcr.io/bharath22783/devops-lab:test

      - name: Verify pulled image
        run: |
          docker image inspect \
            ghcr.io/bharath22783/devops-lab:test \
            --format 'Image={{.RepoTags}} Architecture={{.Architecture}} OS={{.Os}}'

      - name: Stop old deployment
        run: |
          docker rm -f ghcr-app-prod || true

      - name: Start new application
        run: |
          docker run -d \
            --name ghcr-app-prod \
            --restart unless-stopped \
            --network devops-lab_default \
            -p 5002:5000 \
            -e DB_HOST=postgres \
            -e POSTGRES_DB=labdb \
            -e POSTGRES_USER=labuser \
            -e POSTGRES_PASSWORD=labpassword \
            ghcr.io/bharath22783/devops-lab:test

      - name: Verify container exists
        run: |
          echo "=== CONTAINER ==="
          docker ps -a --filter name=ghcr-app-prod

          echo "=== INSPECT ==="
          docker inspect ghcr-app-prod \
            --format 'Status={{.State.Status}} ExitCode={{.State.ExitCode}} RestartCount={{.RestartCount}}'

          echo "=== PORTS ==="
          docker port ghcr-app-prod

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if docker exec ghcr-app-prod \
              wget -qO- http://127.0.0.1:5000/health; then
              echo
              echo "Application is healthy"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed health check"
          docker logs ghcr-app-prod
          exit 1

      - name: Final deployment verification
        run: |
          echo "=== FINAL CONTAINERS ==="
          docker ps -a --filter name=ghcr-app-prod

          echo "=== FINAL STATUS ==="
          docker inspect ghcr-app-prod \
            --format 'Status={{.State.Status}} ExitCode={{.State.ExitCode}} RestartCount={{.RestartCount}}'

          echo "=== FINAL HEALTH ==="
          docker exec ghcr-app-prod \
            wget -qO- http://127.0.0.1:5000/health

          echo
          echo "=== FINAL PORT ==="
          docker port ghcr-app-prod
