name: DevOps Lab CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Build an AMD64 image locally on the GitHub runner.
      # This image is loaded into Docker so we can test it.
      - name: Build Docker image for CI
        run: |
          docker build \
            -t ghcr.io/bharath22783/devops-lab:test \
            ./app

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name postgres-test \
            -e POSTGRES_USER=labuser \
            -e POSTGRES_PASSWORD=labpassword \
            -e POSTGRES_DB=labdb \
            postgres:16-alpine

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker exec postgres-test pg_isready -U labuser -d labdb; then
              exit 0
            fi
            sleep 2
          done

          echo "PostgreSQL did not become ready"
          exit 1

      - name: Create test network
        run: |
          docker network create test-network
          docker network connect test-network postgres-test

      - name: Start application
        run: |
          docker run -d \
            --name app-test \
            --network test-network \
            -e DB_HOST=postgres-test \
            -e POSTGRES_DB=labdb \
            -e POSTGRES_USER=labuser \
            -e POSTGRES_PASSWORD=labpassword \
            ghcr.io/bharath22783/devops-lab:test

      - name: Test application
        run: |
          sleep 5
          docker exec app-test wget -qO- http://127.0.0.1:5000/health

      # Configure Buildx for the final multi-platform image.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish both AMD64 and ARM64 versions.
      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/bharath22783/devops-lab:test

      - name: Cleanup
        if: always()
        run: |
          docker rm -f app-test postgres-test || true
          docker network rm test-network || true
